name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  npm:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.18.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Use an npm version with trusted publishing support
        run: npm install --global npm@12.0.1
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm test
      - name: Apply tag version to public packages
        run: npm run release:version -- "${GITHUB_REF_NAME#v}"
      - run: npm install --package-lock-only --ignore-scripts
      - run: npm run build
      - run: npm run release:check
      - name: Inspect every public package
        run: |
          npm pack --dry-run -w @polymux/protocol
          npm pack --dry-run -w @polymux/core
          npm pack --dry-run -w @polymux/test-gates
          npm pack --dry-run -w @polymux/adapter-web
          npm pack --dry-run -w @polymux/adapter-linux
          npm pack --dry-run -w @polymux/adapter-appium
          npm pack --dry-run -w @polymux/runner
          npm pack --dry-run -w polymux
      - name: Publish dependency packages
        run: |
          npm publish -w @polymux/protocol
          npm publish -w @polymux/core
          npm publish -w @polymux/test-gates
          npm publish -w @polymux/adapter-web
          npm publish -w @polymux/adapter-linux
          npm publish -w @polymux/adapter-appium
          npm publish -w @polymux/runner
      - name: Publish CLI
        run: npm publish -w polymux
