name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run check
      - run: npm test
      - name: Test native credential storage
        if: runner.os != 'Linux'
        run: node scripts/keyring-smoke.mjs
      - name: Verify Linux credential fallback dependency loads
        if: runner.os == 'Linux'
        run: node -e "import('@napi-rs/keyring').then(() => console.log('keyring module loaded'))"

  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e

  mailpit-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.1
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Install verified Mailpit
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/axllent/mailpit/releases/download/v1.30.5/mailpit-linux-amd64.tar.gz \
            --output "$RUNNER_TEMP/mailpit.tar.gz"
          echo "b1499b23e6207d2728a0f154fd27370d0f608dd8ae1a63b734d089dc7f7a8d6f  $RUNNER_TEMP/mailpit.tar.gz" \
            | sha256sum --check -
          mkdir "$RUNNER_TEMP/mailpit"
          tar --extract --gzip --file "$RUNNER_TEMP/mailpit.tar.gz" \
            --directory "$RUNNER_TEMP/mailpit"
          echo "POLYMUX_MAILPIT_BIN=$RUNNER_TEMP/mailpit/mailpit" >> "$GITHUB_ENV"
      - run: npm run test:mailpit
