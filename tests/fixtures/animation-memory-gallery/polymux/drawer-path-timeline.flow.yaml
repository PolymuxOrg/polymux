version: 1
platforms: [web]
baseUrl: http://127.0.0.1:4190
timeoutMs: 2000
name: Drawer motion path timeline memory
description: A drawer must remain clipped to its lane while opening.

steps:
  - launch: { app: animation-memory-gallery }
  - clock: { action: install }
  - clock: { action: pause, ms: 1893456000000 }
  - navigate: /scenario/drawer-path
  - activate: { role: button, name: Start animation }
  - clock: { action: advance, ms: 120 }
  - expect: { target: { role: status }, text: "Animation midpoint" }
  - visual: { name: midpoint-frame, target: { css: ".animation-canvas" }, threshold: 0.005 }
  - clock: { action: advance, ms: 180 }
  - expect: { target: { role: status }, text: "Animation complete" }
  - visual: { name: final-frame, target: { css: ".animation-canvas" }, threshold: 0.005 }
