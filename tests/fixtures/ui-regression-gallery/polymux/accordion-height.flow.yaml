version: 1
name: Accordion expansion reveals its complete content
description: Regression category - height animation.
platforms: [web]
baseUrl: http://127.0.0.1:4180
timeoutMs: 2000

steps:
  - launch: { app: regression-gallery }
  - navigate: /scenario/accordion-height
